/* ---- 底图取样（智能推荐） ---- */
let bgSampleCache = null;
function ensureBgCache(){
  if (!PROJ || !PROJ.bg) return;
  if (bgSampleCache) return;
  const im = bgImg();
  if (!im.complete || !im.naturalWidth) return;   // 底图未就绪，等 onload 后再取样
  bgSampleCache = buildBgCache();
}
function buildBgCache(){
  const img = bgImg();
  if (!img.naturalWidth) return null;
  const c = document.createElement('canvas');
  c.width = img.naturalWidth; c.height = img.naturalHeight;
  const x = c.getContext('2d', { willReadFrequently: true });
  x.drawImage(img, 0, 0);
  let data;
  try { data = x.getImageData(0, 0, c.width, c.height).data; } catch(e){ return null; }
  const rect = PROJ.bgRect || fitRect(PROJ.w, PROJ.h, img.naturalWidth, img.naturalHeight, PROJ.bg.mode);
  const iw = c.width, ih = c.height;
  const out = new Array(PROJ.w * PROJ.h);
  for (let cy = 0; cy < PROJ.h; cy++){
    for (let cx = 0; cx < PROJ.w; cx++){
      // 该格对应底图区域
      const fx0 = Math.floor(((cx - rect.x) / rect.w) * iw);
      const fx1 = Math.ceil(((cx + 1 - rect.x) / rect.w) * iw);
      const fy0 = Math.floor(((cy - rect.y) / rect.h) * ih);
      const fy1 = Math.ceil(((cy + 1 - rect.y) / rect.h) * ih);
      let sr = 0, sg = 0, sb = 0, sn = 0;
      for (let yy = Math.max(0, fy0); yy < Math.min(ih, fy1); yy++){
        for (let xx = Math.max(0, fx0); xx < Math.min(iw, fx1); xx++){
          const i = (yy * iw + xx) * 4;
          if (data[i + 3] < 60) continue;
          sr += data[i]; sg += data[i + 1]; sb += data[i + 2]; sn++;
        }
      }
      if (sn){
        out[cy * PROJ.w + cx] = [sr / sn, sg / sn, sb / sn];
      }
    }
  }
  return out;
}
function bgSample(cx, cy){
  ensureBgCache();
  if (!bgSampleCache) return null;
  return bgSampleCache[cy * PROJ.w + cx] || null;
}
function recommendForCell(cx, cy){
  const s = bgSample(cx, cy);
  if (!s) return null;
  const pal = currentPalette();
  const t = rgbToLab(s[0], s[1], s[2]);
  const arr = pal.map((p, i) => ({ idx: i, no: p.no, d: labDist2(t, p.lab) }));
  arr.sort((a, b) => a.d - b.d);
  return { sample: s, top: arr.slice(0, 6) };
}

/* ---- 编辑动作 ---- */
function applyToCell(cell, val){
  const i = cell.i;
  if (PROJ.cells[i] === val) return;
  const old = PROJ.cells[i];
  PROJ.cells[i] = val;
  pushHistory([{ i, v: old }]);
  markDirty();
  scheduleRender();
}
function applyStrokeMove(cell, val, entries){
  const i = cell.i;
  if (PROJ.cells[i] === val) return;
  entries.push({ i, v: PROJ.cells[i] });
  PROJ.cells[i] = val;
  scheduleRender();
}
function fillRegion(cell){
  const target = PROJ.cells[cell.i];
  if (CUR == null){ openPaletteModal(); return; }
  if (target === CUR){ updateStatusBar('该区域已经是当前颜色'); return; }
  const entries = [];
  const st = [cell.i];
  const seen = new Uint8Array(PROJ.w * PROJ.h);
  while (st.length){
    const i = st.pop();
    if (seen[i] || PROJ.cells[i] !== target) continue;
    seen[i] = 1;
    entries.push({ i, v: PROJ.cells[i] });
    PROJ.cells[i] = CUR;
    const x = i % PROJ.w, y = (i / PROJ.w) | 0;
    if (x > 0) st.push(i - 1);
    if (x < PROJ.w - 1) st.push(i + 1);
    if (y > 0) st.push(i - PROJ.w);
    if (y < PROJ.h - 1) st.push(i + PROJ.w);
  }
  pushHistory(entries);
  markDirty();
  scheduleRender();
}
function clearAllCells(){
  const entries = [];
  for (let i = 0; i < PROJ.cells.length; i++){
    if (PROJ.cells[i] >= 0) entries.push({ i, v: PROJ.cells[i] });
    PROJ.cells[i] = -1;
  }
  pushHistory(entries);
  markDirty();
  scheduleRender();
}
function updateStatusBar(msg){
  if (msg){ $('sbExtra').textContent = msg; return; }
  const tool = TOOLS.find(x => x.id === TOOL);
  $('sbTool').textContent = tool ? `${tool.ic} ${tool.name}` : TOOL;
}

/* ---- 画布事件 ---- */
let dragState = null;   // {mode, entries, last, moved}
function bindCanvasEvents(){
  const cv = $('cv');
  const wrap = $('cvWrap');
  cv.addEventListener('pointerdown', e => {
    e.preventDefault();
    cv.setPointerCapture(e.pointerId);
    paintPtrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (paintPtrs.size === 1){
      const r = wrap.getBoundingClientRect();
      const px = e.clientX - r.left, py = e.clientY - r.top;
      const cell = cellFromPoint(px, py);
      dragState = { entries: [], last: cell, moved: false, sx: e.clientX, sy: e.clientY, button: e.button, ptrId: e.pointerId };
      if (cell && TOOL !== 'pan' && TOOL !== 'recommend' && e.button !== 1 && e.button !== 4 && !spaceDown){
        handlePress(cell, e);
      } else if (TOOL === 'pan' || spaceDown){
        dragState.panStart = { x: e.clientX, y: e.clientY, ox: VIEW.ox, oy: VIEW.oy };
      }
      hudUpdate(px, py, true);
    }
    scheduleRender();
  });
  cv.addEventListener('pointermove', e => {
    const r = wrap.getBoundingClientRect();
    const px = e.clientX - r.left, py = e.clientY - r.top;
    // 双指缩放/平移
    if (paintPtrs.has(e.pointerId)){
      const prev = paintPtrs.get(e.pointerId);
      paintPtrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (paintPtrs.size === 2){
        const arr = [...paintPtrs.values()];
        const d0 = Math.hypot(arr[0].x - arr[1].x, arr[0].y - arr[1].y);
        const mx = (arr[0].x + arr[1].x) / 2 - r.left, my = (arr[0].y + arr[1].y) / 2 - r.top;
        if (pinchStart){
          const k = d0 / pinchStart.d;
          const ns = clamp(VIEW.cp * k, 0.4, 400);
          const kk = ns / VIEW.cp;
          VIEW.ox = mx - (mx - VIEW.ox) * kk;
          VIEW.oy = my - (my - VIEW.oy) * kk;
          VIEW.cp = ns;
          // 平移（中点移动）
          VIEW.ox += (arr[0].x + arr[1].x) / 2 - pinchStart.mx;
          VIEW.oy += (arr[0].y + arr[1].y) / 2 - pinchStart.my;
          renderEditor();
        }
        pinchStart = { d: d0, mx: (arr[0].x + arr[1].x) / 2, my: (arr[0].y + arr[1].y) / 2 };
        if (dragState && dragState.entries.length){ pushHistory(dragState.entries); dragState.entries = []; }
        dragState = null;
        return;
      }
      if (pinchStart && paintPtrs.size < 2) pinchStart = null;
    }
    // 单指拖拽
    if (dragState && e.pointerId === dragState.ptrId && paintPtrs.size === 1){
      const dist = Math.hypot(e.clientX - dragState.sx, e.clientY - dragState.sy);
      if (dist > 7) dragState.moved = true;
      if (TOOL === 'pan' || spaceDown || e.buttons === 4 || e.button === 1){
        if (dragState.panStart == null) dragState.panStart = { x: e.clientX, y: e.clientY, ox: VIEW.ox, oy: VIEW.oy };
        VIEW.ox = dragState.panStart.ox + (e.clientX - dragState.panStart.x);
        VIEW.oy = dragState.panStart.oy + (e.clientY - dragState.panStart.y);
        renderEditor();
        return;
      }
      const cell = cellFromPoint(px, py);
      if (cell && (dragState.moved || TOOL !== 'recommend')){
        if (dragState.last && (cell.x !== dragState.last.x || cell.y !== dragState.last.y)){
          handleMovePaint(cell, dragState);
          dragState.last = cell;
        } else if (!dragState.last){
          dragState.last = cell;
        }
      }
    }
    hudUpdate(px, py, false);
    scheduleRender();
  });
  function onUp(e){
    if (paintPtrs.has(e.pointerId)){
      paintPtrs.delete(e.pointerId);
    }
    pinchStart = null;
    if (dragState && e.pointerId === dragState.ptrId){
      const wasTap = !dragState.moved;
      const cell = dragState.last;
      // 推荐工具：点击才触发
      if (wasTap && cell && TOOL === 'recommend'){
        recommendTap(cell);
      }
      if (dragState.entries.length) pushHistory(dragState.entries);
      dragState = null;
    }
    updateUndoBtns();
  }
  cv.addEventListener('pointerup', onUp);
  cv.addEventListener('pointercancel', onUp);
  cv.addEventListener('wheel', e => {
    e.preventDefault();
    const r = wrap.getBoundingClientRect();
    const mx = e.clientX - r.left, my = e.clientY - r.top;
    const k = e.deltaY < 0 ? 1.15 : 1 / 1.15;
    const ns = clamp(VIEW.cp * k, 0.4, 400);
    const kk = ns / VIEW.cp;
    VIEW.ox = mx - (mx - VIEW.ox) * kk;
    VIEW.oy = my - (my - VIEW.oy) * kk;
    VIEW.cp = ns;
    renderEditor();
  }, { passive: false });
  cv.addEventListener('contextmenu', e => e.preventDefault());
}
function handlePress(cell, e){
  const pal = currentPalette();
  if (TOOL === 'brush'){
    if (CUR == null){ openPaletteModal(); return; }
    const val = e.button === 2 ? -1 : CUR;
    if (val === -1){ if (PROJ.cells[cell.i] !== -1){ dragState.entries.push({ i: cell.i, v: PROJ.cells[cell.i] }); PROJ.cells[cell.i] = -1; markDirty(); } }
    else if (PROJ.cells[cell.i] !== val){ dragState.entries.push({ i: cell.i, v: PROJ.cells[cell.i] }); PROJ.cells[cell.i] = val; markDirty(); }
    scheduleRender();
  } else if (TOOL === 'eraser'){
    if (PROJ.cells[cell.i] !== -1){
      dragState.entries.push({ i: cell.i, v: PROJ.cells[cell.i] });
      PROJ.cells[cell.i] = -1;
      markDirty();
    }
    scheduleRender();
  } else if (TOOL === 'pick'){
    const v = PROJ.cells[cell.i];
    if (v >= 0){ CUR = v; updateDock(); updateStatusBar(`已吸取 ${beadCode(pal[v])} ${pal[v].name}`); }
    else if (PROJ.bg){
      const s = bgSample(cell.x, cell.y);
      if (s){ CUR = nearestIndex(pal, s[0], s[1], s[2]); updateDock(); updateStatusBar(`已按底图取色 → ${beadCode(pal[CUR])} ${pal[CUR].name}`); }
      else updateStatusBar('该位置没有底图内容');
    } else updateStatusBar('该格为空白，无法取色');
    dragState.entries.length = 0;
  } else if (TOOL === 'fill'){
    if (CUR == null){ openPaletteModal(); return; }
    fillRegion(cell);
    dragState.entries.length = 0;
  }
}
function handleMovePaint(cell, ds){
  if (TOOL === 'brush'){
    if (CUR == null) return;
    const val = ds.button === 2 ? -1 : CUR;
    if (PROJ.cells[cell.i] !== val){
      ds.entries.push({ i: cell.i, v: PROJ.cells[cell.i] });
      PROJ.cells[cell.i] = val;
      markDirty();
    }
  } else if (TOOL === 'eraser'){
    if (PROJ.cells[cell.i] !== -1){
      ds.entries.push({ i: cell.i, v: PROJ.cells[cell.i] });
      PROJ.cells[cell.i] = -1;
      markDirty();
    }
  }
  scheduleRender();
}
function recommendTap(cell){
  if (!PROJ.bg){
    askAlert('智能推荐需要底图', '请在“🖼️ 上传图片 → 底图描图”模式下使用智能推荐，它会读取格子下方的图片颜色。');
    return;
  }
  const res = recommendForCell(cell.x, cell.y);
  if (!res){
    askAlert('此处无底图内容', '该格子下方没有图片内容（透明区域或留白处），无法推荐颜色。');
    return;
  }
  const pal = currentPalette();
  const maxD = res.top[res.top.length - 1].d;
  const m = modal({
    title: `✨ 推荐颜色 · 格子 (${cell.x + 1}, ${cell.y + 1})`,
    body: `
      <div class="msgbox" style="margin-bottom:10px">该位置底图颜色 ≈ <b style="color:${rgbToHex(res.sample[0]|0, res.sample[1]|0, res.sample[2]|0)}">${rgbToHex(Math.round(res.sample[0]), Math.round(res.sample[1]), Math.round(res.sample[2]))}</b>，以下为最接近的拼豆色号：</div>
      <div class="rec-list">` + res.top.map((r, k) => {
        const p = pal[r.idx];
        const pct = Math.max(0, Math.round((1 - r.d / (maxD + 1)) * 100));
        const badge = k === 0 ? '<span class="r-tag" style="background:color-mix(in srgb,var(--ok) 20%,transparent);color:var(--ok)">最接近</span>' : `<span class="r-tag">${pct}%</span>`;
        return `<button class="rec-item" data-idx="${r.idx}">
          <span class="sw" style="background:${p.hex}"></span>
          <span class="r-mid"><span class="r-no">${beadCode(p)} · ${esc(p.name)}</span><br><span class="r-name">${p.hex}</span></span>
          ${badge}
        </button>`;
      }).join('') + `</div>
      <div class="hint-line">选择后会以该颜色涂上这个格子，并设为当前画笔颜色，可继续涂相邻格子。</div>`,
    foot: `<button class="btn" id="recMore">打开全部色板</button><button class="btn" data-close="0">取消</button>`,
    init: mm => {
      mm.body.querySelectorAll('.rec-item').forEach(b => b.addEventListener('click', () => {
        const idx = parseInt(b.getAttribute('data-idx'), 10);
        CUR = idx;
        const old = PROJ.cells[cell.i];
        PROJ.cells[cell.i] = idx;
        pushHistory(old === idx ? [] : [{ i: cell.i, v: old }]);
        markDirty();
        updateDock();
        scheduleRender();
        m.close();
        setTool('brush');
      }));
      mm.panel.querySelector('#recMore').addEventListener('click', () => {
        if (CUR == null){ /* 无碍 */ }
        m.close();
        openPaletteModal();
      });
    }
  });
}

/* ===================== 保存草稿 ===================== */
function saveCurrentToDrafts(){
  if (!PROJ) return;
  const name = sanitizeName(PROJ.name || $('eName').value || '未命名图纸');
  PROJ.name = name;
  PROJ.updatedAt = Date.now();
  const drafts = readDrafts();
  const snap = {
    id: PROJ._draftId || ('d' + Date.now() + Math.floor(Math.random() * 9999)),
    name,
    updatedAt: PROJ.updatedAt,
    w: PROJ.w, h: PROJ.h, paletteN: PROJ.paletteN,
    proj: cloneProject(PROJ)
  };
  PROJ._draftId = snap.id;
  const ix = drafts.findIndex(x => x.id === snap.id);
  if (ix >= 0) drafts[ix] = snap; else drafts.push(snap);
  writeDrafts(drafts);
  DIRTY = false;
  renderHomeDrafts();
  askAlert('已保存到草稿 💾', `「${esc(name)}」(${PROJ.w}×${PROJ.h}) 已存入本地草稿箱。<br>之后可从首页或右上角 📁 草稿箱 打开继续修改。`);
}
function cloneProject(p){
  const c = {
    v: p.v, gen: p.gen,
    name: p.name, paletteN: p.paletteN, w: p.w, h: p.h,
    cells: (p.cells || []).slice(),
    bg: p.bg ? Object.assign({}, p.bg) : null,
    showNumbers: p.showNumbers, showGrid: p.showGrid,
    createdAt: p.createdAt, updatedAt: p.updatedAt,
    _draftId: p._draftId
  };
  return c;
}

/* ===================== 导出 ===================== */
function renderExportCanvas(proj, o, bgEl){
  // o: {px, numbers, grid, legend, empty:'white'|'bg'|'through', bgOpacity}
  const pal = palette(proj.paletteN);
  const px = clamp(o.px || 20, 4, 120);
  const W = proj.w, H = proj.h;
  const cells = proj.cells;
  // 空白处理决定
  const hasBg = !!(proj.bg && proj.bg.dataURL);
  let bgPix = null;
  if (hasBg && bgEl && bgEl.complete && o.empty === 'bg'){
    bgPix = computeBgForEmpty(proj, bgEl);
  }
  // 图例
  const usedMap = new Map();
  for (let i = 0; i < cells.length; i++){
    if (cells[i] >= 0) usedMap.set(cells[i], (usedMap.get(cells[i]) || 0) + 1);
  }
  let legend = null;
  if (o.legend){
    legend = [];
    [...usedMap.keys()].sort((a, b) => a - b).forEach(idx => legend.push({ p: pal[idx], n: usedMap.get(idx) }));
  }
  // 总豆数 = 已上色格子 +（空白按底图近似时）自动上色格子
  let totalBeads = 0;
  for (let i = 0; i < cells.length; i++){
    if (cells[i] >= 0) totalBeads++;
    else if (bgPix && bgPix[i]) totalBeads++;
  }
  const colorCount = usedMap.size;
  const margin = 10;
  const hh = 56;   // 顶部信息区高度
  const gw = W * px, gh = H * px;
  let lh = 0;
  if (legend && legend.length){
    let cw = 0, rowsN = 1;
    for (const it of legend){
      const wEst = 128;
      if (cw + wEst > gw && cw > 0){ rowsN++; cw = wEst; }
      else cw += wEst;
    }
    rowsN += 1; // 安全余量
    lh = rowsN * 20 + 6;
    lh += 22;   // 末尾“总计”行
  }
  const c = document.createElement('canvas');
  c.width = gw + margin * 2;
  c.height = hh + gh + margin * 2 + lh;
  const x = c.getContext('2d');
  // 纸张
  x.fillStyle = '#ffffff';
  x.fillRect(0, 0, c.width, c.height);
  // 顶部信息
  x.fillStyle = '#1a1d2e';
  x.textBaseline = 'top';
  x.font = '700 16px -apple-system,"Segoe UI","Microsoft YaHei",sans-serif';
  x.fillText(String(proj.name || '拼豆图纸'), margin, 12);
  x.fillStyle = '#7a7f9a';
  x.font = '12px -apple-system,"Segoe UI","Microsoft YaHei",sans-serif';
  x.fillText(`${W} × ${H} 格  ·  ${paletteLabel(proj.paletteN)}  ·  共 ${totalBeads} 颗豆子  ·  ${colorCount} 种颜色`, margin, 34);
  x.save();
  x.translate(margin, margin + hh);
  const drawBg = hasBg && bgEl && bgEl.complete && o.empty === 'through';
  if (drawBg){
    const rect = fitRect(W, H, bgEl.naturalWidth, bgEl.naturalHeight, proj.bg.mode || 'cover');
    x.save();
    x.globalAlpha = (o.bgOpacity == null ? 1 : o.bgOpacity);
    x.drawImage(bgEl, rect.x * px, rect.y * px, rect.w * px, rect.h * px);
    x.restore();
  }
  // 填充每个格子
  for (let y = 0; y < H; y++){
    for (let xx = 0; xx < W; xx++){
      const i = y * W + xx;
      let idx = cells[i];
      if (idx < 0 && bgPix && bgPix[i]){
        idx = nearestIndex(pal, bgPix[i][0], bgPix[i][1], bgPix[i][2]);
      }
      if (idx >= 0 || !drawBg){
        x.fillStyle = idx >= 0 ? pal[idx].hex : '#ffffff';
        x.fillRect(xx * px, y * px, px, px);
      }
    }
  }
  // 网格线
  if (o.grid !== false){
    x.strokeStyle = 'rgba(0,0,0,.16)';
    x.lineWidth = 1;
    x.beginPath();
    for (let i = 0; i <= W; i++){ x.moveTo(i * px + .5, 0); x.lineTo(i * px + .5, gh); }
    for (let j = 0; j <= H; j++){ x.moveTo(0, j * px + .5); x.lineTo(gw, j * px + .5); }
    x.stroke();
  }
  // 色号
  if (o.numbers){
    const hasCode = pal.some(p => p.code);
    const fs = hasCode ? Math.max(5, px * 0.3) : Math.max(5, px * 0.42);
    x.textAlign = 'center'; x.textBaseline = 'middle';
    x.font = `600 ${fs.toFixed(1)}px -apple-system,"Segoe UI","Microsoft YaHei",sans-serif`;
    for (let y = 0; y < H; y++){
      for (let xx = 0; xx < W; xx++){
        const i = y * W + xx;
        let idx = cells[i];
        if (idx < 0 && bgPix && bgPix[i]) idx = nearestIndex(pal, bgPix[i][0], bgPix[i][1], bgPix[i][2]);
        if (idx < 0) continue;
        const col = pal[idx];
        x.fillStyle = col.r * 0.299 + col.g * 0.587 + col.b * 0.114 > 150 ? 'rgba(0,0,0,.78)' : 'rgba(255,255,255,.95)';
        x.fillText(beadCode(col), xx * px + px / 2, y * px + px / 2 + 0.5);
      }
    }
  }
  x.restore();
  // 图例
  if (legend && legend.length){
    x.save();
    x.translate(margin, margin + hh + gh + 8);
    const sw = 16;
    let curX = 0, curY = 0;
    x.font = '11px -apple-system,"Segoe UI","Microsoft YaHei",sans-serif';
    x.textBaseline = 'middle';
    legend.forEach(item => {
      const label = `${beadCode(item.p)} ${item.p.name} ×${item.n}`;
      if (curX + 150 > gw && curX > 0){ curX = 0; curY += 20; }
      x.fillStyle = item.p.hex;
      x.fillRect(curX, curY, sw, sw);
      x.strokeStyle = 'rgba(0,0,0,.25)';
      x.strokeRect(curX, curY, sw, sw);
      x.fillStyle = '#333';
      x.fillText(label, curX + sw + 4, curY + sw / 2 + .5);
      const tw = x.measureText(label).width;
      curX += sw + 4 + tw + 16;
    });
    // 总计
    const totalY = curY + 24;
    x.fillStyle = '#1a1d2e';
    x.font = '700 13px -apple-system,"Segoe UI","Microsoft YaHei",sans-serif';
    x.fillText(`总计需豆子：${totalBeads} 颗`, 0, totalY + sw / 2);
    x.restore();
  }
  return c;
}
function computeBgForEmpty(proj, bgEl){
  if (!proj.bg || !proj.bg.dataURL) return null;
  const img = bgEl || proj._bgExport;
  if (!img || !img.complete || !img.naturalWidth) return null;
  const c = document.createElement('canvas');
  c.width = img.naturalWidth; c.height = img.naturalHeight;
  const x = c.getContext('2d', { willReadFrequently: true });
  x.drawImage(img, 0, 0);
  const data = x.getImageData(0, 0, c.width, c.height).data;
  const rect = fitRect(proj.w, proj.h, img.naturalWidth, img.naturalHeight, proj.bg.mode || 'cover');
  const iw = c.width, ih = c.height;
  const out = new Array(proj.w * proj.h);
  for (let cy = 0; cy < proj.h; cy++){
    for (let cx = 0; cx < proj.w; cx++){
      const fx0 = Math.floor(((cx - rect.x) / rect.w) * iw);
      const fx1 = Math.ceil(((cx + 1 - rect.x) / rect.w) * iw);
      const fy0 = Math.floor(((cy - rect.y) / rect.h) * ih);
      const fy1 = Math.ceil(((cy + 1 - rect.y) / rect.h) * ih);
      let sr = 0, sg = 0, sb = 0, sn = 0;
      for (let yy = Math.max(0, fy0); yy < Math.min(ih, fy1); yy++){
        for (let xx = Math.max(0, fx0); xx < Math.min(iw, fx1); xx++){
          const i = (yy * iw + xx) * 4;
          if (data[i + 3] < 60) continue;
          sr += data[i]; sg += data[i + 1]; sb += data[i + 2]; sn++;
        }
      }
      if (sn) out[cy * proj.w + cx] = [sr / sn, sg / sn, sb / sn];
    }
  }
  return out;
}
function ensureBgImg(proj){
  return new Promise(res => {
    if (!proj.bg || !proj.bg.dataURL){ res(null); return; }
    if (proj._bgExport && proj._bgExport.complete){ res(proj._bgExport); return; }
    const img = new Image();
    proj._bgExport = img;
    img.onload = () => res(img);
    img.onerror = () => res(null);
    img.src = proj.bg.dataURL;
  });
}
async function exportPNG(proj, o){
  const bgEl = await ensureBgImg(proj);
  const c = renderExportCanvas(proj, o, bgEl);
  downloadCanvas(c, sanitizeName(proj.name) + '.png', 'image/png');
}
function projectToText(proj){
  const pal = palette(proj.paletteN);
  const lines = [];
  lines.push(`# 拼豆图纸: ${sanitizeName(proj.name)}`);
  lines.push(`# 尺寸: ${proj.w} x ${proj.h}  色板: ${paletteLabel(proj.paletteN)}  空白=0`);
  for (let y = 0; y < proj.h; y++){
    const row = [];
    for (let x = 0; x < proj.w; x++){
      const v = proj.cells[y * proj.w + x];
      row.push(v >= 0 ? beadCode(pal[v]) : '0');
    }
    lines.push(row.join(' '));
  }
  lines.push('# --- 色号对照表 ---');
  const used = {};
  proj.cells.forEach(v => { if (v >= 0) used[v] = (used[v] || 0) + 1; });
  Object.keys(used).map(Number).sort((a, b) => a - b).forEach(v => {
    const p = pal[v];
    lines.push(`# ${beadCode(p)} ${p.hex} ${p.name} x${used[v]}`);
  });
  const total = Object.values(used).reduce((a, b) => a + b, 0);
  lines.push(`# --- 总计需豆子: ${total} 颗 ---`);
  return lines.join('\n');
}
function exportText(proj){
  const txt = projectToText(proj);
  downloadBlob(new Blob([txt], { type: 'text/plain;charset=utf-8' }), sanitizeName(proj.name) + '-色号表.txt');

      });

        const oldPal = palette(PROJ.paletteN);

        for (let i = 0; i < PROJ.cells.length; i++){
          if (PROJ.cells[i] >= 0){
            const o = oldPal[PROJ.cells[i]];
            PROJ.cells[i] = nearestIndex(newPal, o.r, o.g, o.b);
          }
        }
        PROJ.paletteN = newN;
        if (CUR != null && CUR < oldPal.length){
          const oc = oldPal[CUR];
          CUR = nearestIndex(newPal, oc.r, oc.g, oc.b);
        } else if (CUR != null && CUR >= newPal.length){
          CUR = defaultColorIdx(newPal);
        }
        DIRTY = true; markDirty();
        refreshEditorMeta();
        updateDock();
        mm.close();
      });
    }
  });
}

  if (!PROJ){ showHome(); return; }
  if (DIRTY){
    askConfirm('有未保存修改', '当前图纸有修改尚未保存到草稿。\n\n· 确定：直接返回（修改丢失，可先取消去点“💾 保存”）\n· 也可以先保存再返回', '直接返回', true).then(ok => {
      if (ok){ clearAutosave(); showHome(); }
    });
  } else {
    clearAutosave();
    showHome();
  }
}
function showHome(){
  PROJ = null;
  HIS.length = 0; REDO.length = 0;
  const ev = $('editorView');
  ev.classList.add('hidden');
  ev.style.display = 'none';
  $('homeView').classList.remove('hidden');
  renderHomeDrafts();
}

/* ===================== 首页草稿渲染 ===================== */
function renderHomeDrafts(){
  const drafts = readDrafts().slice().sort((a, b) => b.updatedAt - a.updatedAt).slice(0, 8);
  $('draftCnt').textContent = String(readDrafts().length);
  const wrap = $('homeDrafts');
  if (!drafts.length){
    wrap.innerHTML = `<div class="draft-card new" id="draftNewCard"><span style="font-size:26px">➕</span><span>创建第一份图纸</span></div>`;
    $('draftNewCard').addEventListener('click', () => startMode('m1'));
    return;
  }
  wrap.innerHTML = drafts.map(d => `
    <div class="draft-card" data-id="${d.id}">
      <canvas width="128" height="128"></canvas>
      <div class="dc-name">${esc(d.name)}</div>
      <div class="dc-sub">${d.w}×${d.h} · ${fmtTime(d.updatedAt).slice(5)}</div>
    </div>`).join('');
  wrap.querySelectorAll('.draft-card').forEach(card => {
    const id = card.getAttribute('data-id');
    const d = drafts.find(x => x.id === id);
    const cv = card.querySelector('canvas');
    const c = cv.getContext('2d');
    const pal = palette(d.paletteN);
    const s = Math.min(1, 128 / Math.max(d.w, d.h));
    c.imageSmoothingEnabled = false;
    c.fillStyle = '#fff';
    c.fillRect(0, 0, 128, 128);
    const ox = (128 - d.w * s) / 2, oy = (128 - d.h * s) / 2;
    // 用临时小画布按格绘制
    const t = document.createElement('canvas');
    t.width = d.w; t.height = d.h;
    const tc = t.getContext('2d');
    for (let y = 0; y < d.h; y++){
      for (let x = 0; x < d.w; x++){
        const v = (d.cells || d.proj.cells)[y * d.w + x];
        tc.fillStyle = v >= 0 ? pal[v].hex : '#fff';
        tc.fillRect(x, y, 1, 1);
      }
    }
    c.drawImage(t, ox, oy, d.w * s, d.h * s);
    card.addEventListener('click', () => loadDraftById(id));
  });
}

/* ===================== 自动恢复 ===================== */
function tryRestoreAutosave(){
  try {
    const s = JSON.parse(localStorage.getItem(AUTO_KEY));
    if (s && s.proj && s.proj.cells && s.ts){
      const age = Date.now() - s.ts;
      if (age < 1000 * 60 * 60 * 24 * 7){
        askConfirm('发现未保存的图纸', `上次编辑的「${esc(s.proj.name)}」(${s.proj.w}×${s.proj.h}) 尚未保存。要恢复继续编辑吗？`, '恢复').then(ok => {
          if (ok){ openEditor(s.proj); }
          else clearAutosave();
        });
      } else clearAutosave();
    }
  } catch(e){ clearAutosave(); }
}

/* ===================== 初始化 ===================== */
function init(){
  // 主题
  const prefs = loadPrefs();
  const def = prefs.theme || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  applyTheme(def);
  $('btnTheme').addEventListener('click', toggleTheme);
  $('btnHome').addEventListener('click', backHome);
  $('btnDrafts').addEventListener('click', () => openImportModal());
  $('btnHelp').addEventListener('click', openHelp);
  // 编辑器按钮
  $('eBack').addEventListener('click', backHome);
  $('eUndo').addEventListener('click', doUndo);
  $('eRedo').addEventListener('click', doRedo);
  $('eSave').addEventListener('click', saveCurrentToDrafts);
  $('eExport').addEventListener('click', openExportModal);
  $('eMore').addEventListener('click', openMoreMenu);
  $('ePaletteChip').addEventListener('click', changePalette);
  $('dockCur').addEventListener('click', openPaletteModal);
  $('btnPalette').addEventListener('click', openPaletteModal);
  $('zIn').addEventListener('click', () => { zoomStep(1.35); });
  $('zOut').addEventListener('click', () => { zoomStep(1 / 1.35); });
  $('zFit').addEventListener('click', () => { fitView(); renderEditor(); });
  $('eName').addEventListener('keydown', e => { if (e.key === 'Enter') e.target.blur(); });
  $('eName').addEventListener('input', () => {
    if (PROJ){ PROJ.name = $('eName').value; DIRTY = true; scheduleAutosave(); }
  });
  // 空格 = 临时抓手（平移）；避免在输入框里触发
  window.addEventListener('keydown', e => {
    if (e.code !== 'Space') return;
    const ae = document.activeElement;
    if (ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA' || ae.isContentEditable)) return;
    if (!PROJ && !document.getElementById('cuCv')) return;
    spaceDown = true;
    e.preventDefault();
    updateSpaceCursor();
  });
  window.addEventListener('keyup', e => {
    if (e.code === 'Space'){ spaceDown = false; updateSpaceCursor(); }
  });
  // 画布
  bindCanvasEvents();
  buildDockTools();
  setTool('brush');
  const ro = new ResizeObserver(debounce(() => { if (PROJ){ fitView(); renderEditor(); } }, 150));
  ro.observe($('cvWrap'));
  // vh 适配
  function vh(){ const v = window.innerHeight; document.documentElement.style.setProperty('--vh', v + 'px'); }
  window.addEventListener('resize', debounce(vh, 120));
  vh();
  // 首页
  buildHome();
  updateUndoBtns();
  // 首次帮助
  if (!prefs.seenHelp){
    prefs.seenHelp = 1;
    localStorage.setItem('pd.prefs', JSON.stringify(prefs));
    setTimeout(openHelp, 350);
  }
  tryRestoreAutosave();
}
function zoomStep(k){
  const wrap = $('cvWrap');
  const mx = wrap.clientWidth / 2, my = wrap.clientHeight / 2;
  const ns = clamp(VIEW.cp * k, 0.4, 400);
  const kk = ns / VIEW.cp;
  VIEW.ox = mx - (mx - VIEW.ox) * kk;
  VIEW.oy = my - (my - VIEW.oy) * kk;
  VIEW.cp = ns;
  renderEditor();
}
// 阻止 body 在打开模态时滚动
document.addEventListener('DOMContentLoaded', init);
</script>
